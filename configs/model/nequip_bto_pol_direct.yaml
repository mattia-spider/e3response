# allegro-pol BaTiO3, direct model: energy, forces, dipole moment, Born charges and
# polarizability each read out by its own equivariant head.  Same stack, losses and weights as
# nequip_bto_pol_sobolev.yaml, via experiment/bto_pol_sobolev_vs_direct.yaml.

_target_: tensorial.ReaxModule

optimizer:
  _target_: optax.chain
  _args_:
    # Same schedule as the NMR models (see nequip_nmr.yaml): Adam, then reduce_on_plateau
    # halving the step after 20 epochs without a better training loss
    - _target_: optax.adam
      learning_rate: 0.01

    - _target_: optax.contrib.reduce_on_plateau
      factor: 0.5
      accumulation_size: ${from_data.steps_per_epoch}
      patience: 20
      rtol: 0.0001
      atol: 0.001
      cooldown: 5
      min_scale: 1.0e-6

metrics:
  energy:
    _target_: tensorial.gcnn.graph_metric
    metric: rmse
    predictions: globals.predicted_energy
    targets: globals.energy
  forces:
    _target_: tensorial.gcnn.graph_metric
    metric: rmse
    predictions: nodes.predicted_forces
    targets: nodes.forces
  BEC:
    _target_: tensorial.gcnn.graph_metric
    metric: rmse
    predictions: nodes.predicted_born_charges
    targets: nodes.born_charges
  polarizability:
    _target_: tensorial.gcnn.graph_metric
    metric: rmse
    predictions: globals.predicted_polarizability
    targets: globals.polarizability
  # Against the nearest lattice image of the stored (folded) dipole
  dipole:
    _target_: e3response.losses.folded_dipole_metric
    metric: rmse

# Same terms and weights in nequip_bto_pol_direct.yaml and nequip_bto_pol_sobolev.yaml, set in
# experiment/bto_pol_sobolev_vs_direct.yaml
loss_fn:
  _target_: tensorial.gcnn.WeightedLoss
  weights:
    - ${oc.select:w_energy,1.}
    - ${oc.select:w_forces,1.}
    - ${oc.select:w_dipole,1.}
    - ${oc.select:w_born,1.}
    - ${oc.select:w_polarizability,1.}
  loss_fns:
    - _target_: tensorial.gcnn.Loss
      loss_fn: squared_error
      predictions: globals.predicted_energy
      targets: globals.energy

    - _target_: tensorial.gcnn.Loss
      loss_fn: squared_error
      predictions: nodes.predicted_forces
      targets: nodes.forces

    # The dipole of a periodic cell is defined up to e times a lattice vector
    - _target_: e3response.losses.FoldedDipoleLoss

    - _target_: tensorial.gcnn.Loss
      loss_fn: squared_error
      predictions: nodes.predicted_born_charges
      targets: nodes.born_charges

    - _target_: tensorial.gcnn.Loss
      loss_fn: squared_error
      predictions: globals.predicted_polarizability
      targets: globals.polarizability

model:
  _target_: tensorial.nn.Sequential
  layers:
    - _target_: tensorial.gcnn.atomic.SpeciesTransform
      atomic_numbers: ${from_data.atomic_numbers}

    - _target_: tensorial.gcnn.NodewiseEmbedding
      attrs:
        species:
          _target_: tensorial.tensors.OneHot
          num_classes: ${from_data.n_elements}

    - _target_: tensorial.gcnn.EdgeVectors

    - _target_: tensorial.gcnn.EdgewiseEncoding
      attrs:
        edge_vectors:
          _target_: tensorial.tensors.SphericalHarmonic
          irreps: 0e + 1o
          normalise: True

    - _target_: tensorial.gcnn.RadialBasisEdgeEncoding
      r_max: ${r_max}

    # Hidden irreps: `mul` channels of every irrep up to `ell_max`, see
    # tensorial.make_irreps.  Override per run, e.g. `mul=16 ell_max=3 num_layers=4`.
    # Keep only scalars and reduce the number passing this point
    - _target_: tensorial.gcnn.NodewiseLinear
      field: attributes
      irreps_out:
        _target_: tensorial.make_irreps
        mul: ${oc.select:mul,16}
        ell_max: ${oc.select:ell_max,2}

    - _target_: tensorial.gcnn.Nequip
      hidden_irreps:
        _target_: tensorial.make_irreps
        mul: ${oc.select:mul,16}
        ell_max: ${oc.select:ell_max,2}
      num_layers: ${oc.select:num_layers,3}
      avg_num_neighbours: ${from_data.avg_num_neighbours}

    - _target_: tensorial.gcnn.NodewiseLinear
      irreps_out: 4x0e + 4x0o + 4x1e + 4x1o + 4x2e + 4x2o + 2x3o + 2x3e

    - _target_: tensorial.gcnn.NodewiseLinear
      irreps_out: 1x0e
      out_field: energy # Per-atom energy

    # Per-species baseline, so the energy head learns residuals rather than the ~-750 eV offset
    - _target_: tensorial.gcnn.atomic.per_species_rescale
      num_types: ${from_data.n_elements}
      field: nodes.energy
      out_field: nodes.energy
      shifts: ${from_data.energy_shifts}
      scales: 1.0

    - _target_: tensorial.gcnn.NodewiseReduce
      field: energy
      out_field: predicted_energy
      as_array: True

    # Direct model: every labelled quantity has its own equivariant head on the same features

    # Forces, one 1o vector per atom (not -∂E/∂u)
    - _target_: tensorial.gcnn.NodewiseLinear
      irreps_out: 1x1o
      out_field: predicted_forces

    - _target_: tensorial.gcnn.NodewiseDecoding
      in_field: predicted_forces
      attrs:
        predicted_forces:
          _target_: tensorial.CartesianTensor
          formula: i
          i: 1o

    # Dipole moment, a sum of per-atom 1o contributions
    - _target_: tensorial.gcnn.NodewiseLinear
      irreps_out: 1x1o
      out_field: dipole_contribution

    - _target_: tensorial.gcnn.NodewiseDecoding
      in_field: dipole_contribution
      attrs:
        dipole_contribution:
          _target_: tensorial.CartesianTensor
          formula: i
          i: 1o

    - _target_: tensorial.gcnn.NodewiseReduce
      field: dipole_contribution
      out_field: predicted_dipole_moment
      reduce: sum
      as_array: True

    # Born charges per atom, 1o x 1o = 0e + 1e + 2e
    - _target_: tensorial.gcnn.NodewiseLinear
      irreps_out: 1x0e + 1x1e + 1x2e
      out_field: predicted_born_charges

    - _target_: tensorial.gcnn.NodewiseDecoding
      in_field: predicted_born_charges
      attrs:
        predicted_born_charges:
          _target_: tensorial.CartesianTensor
          formula: ij
          i: 1o
          j: 1o

    # Polarizability, a sum of symmetric per-atom contributions (0e + 2e)
    - _target_: tensorial.gcnn.NodewiseLinear
      irreps_out: 1x0e + 1x2e
      out_field: polarizability_contribution

    - _target_: tensorial.gcnn.NodewiseDecoding
      in_field: polarizability_contribution
      attrs:
        polarizability_contribution:
          _target_: tensorial.CartesianTensor
          formula: ij=ji
          i: 1o
          j: 1o

    - _target_: tensorial.gcnn.NodewiseReduce
      field: polarizability_contribution
      out_field: predicted_polarizability
      reduce: sum
      as_array: True
