# MACE variant of nequip_bto_direct.yaml: the same embedding, heads and losses, with tensorial.gcnn.Mace
# as the interaction stack.
# BTO direct model: separate equivariant readouts for the Born charges, Raman tensors and
# dielectric tensor.  Same stack and losses as nequip_bto_sobolev.yaml.
_target_: tensorial.ReaxModule

optimizer:
  _target_: optax.chain
  _args_:
    # Same schedule as the NMR models (see nequip_nmr.yaml): Adam, then reduce_on_plateau
    # halving the step after 20 epochs without a better training loss
    - _target_: optax.adam
      learning_rate: 0.01

    - _target_: optax.contrib.reduce_on_plateau
      factor: 0.5
      accumulation_size: ${from_data.steps_per_epoch}
      patience: 20
      rtol: 0.0001
      # Relative criterion only: the weighted BTO losses are ~0.07, where the NMR models' atol
      # of 0.001 asks for a 1.5% gain per epoch and halves the step down to 1/4096 by epoch ~400
      atol: 0.0
      cooldown: 5
      min_scale: 1.0e-6

metrics:
  BEC:
    _target_: tensorial.gcnn.graph_metric
    metric: rmse
    predictions: nodes.predicted_born_charges
    targets: nodes.born_charges
  raman:
    _target_: tensorial.gcnn.graph_metric
    metric: rmse
    predictions: nodes.predicted_raman_tensors
    targets: nodes.raman_tensors
  dielectric:
    _target_: tensorial.gcnn.graph_metric
    metric: rmse
    predictions: globals.predicted_dielectric_tensor
    targets: globals.dielectric_tensor

# Same weights in nequip_bto_direct.yaml and nequip_bto_sobolev.yaml; override both with
# e.g. `++w_born=1000 ++w_raman=1 ++w_dielectric=100`
loss_fn:
  _target_: tensorial.gcnn.WeightedLoss
  weights:
    - ${oc.select:w_born,1000.}
    - ${oc.select:w_raman,1.}
    - ${oc.select:w_dielectric,100.}
  loss_fns:
    - _target_: tensorial.gcnn.Loss
      loss_fn: squared_error
      predictions: nodes.predicted_born_charges
      targets: nodes.born_charges

    - _target_: tensorial.gcnn.Loss
      loss_fn: squared_error
      predictions: nodes.predicted_raman_tensors
      targets: nodes.raman_tensors

    - _target_: tensorial.gcnn.Loss
      loss_fn: squared_error
      predictions: globals.predicted_dielectric_tensor
      targets: globals.dielectric_tensor

model:
  _target_: tensorial.nn.Sequential
  layers:
    - _target_: tensorial.gcnn.atomic.SpeciesTransform
      atomic_numbers: ${from_data.atomic_numbers}

    # The same inputs as the Sobolev counterpart, the external field included, so that the two differ
    # only in how the tensors are produced (tests/test_model_configs.py); the field is zero in the
    # DFT data and per structure in the synthetic set
    # Units of field and energy: the field is multiplied by c here and the energy by 1/c
    # below.  Neither has a label, so this changes no prediction's meaning, only the scales a
    # fresh network starts from: Born charges O(1), χ and R O(c), as BTO needs (see
    # e3response.electric_linked.Scale).
    - _target_: e3response.electric_linked.Scale
      field: globals.external_electric_field
      factor: ${oc.select:field_scale,100.}

    - _target_: tensorial.gcnn.NodewiseEmbedding
      attrs:
        species:
          _target_: tensorial.tensors.OneHot
          num_classes: ${from_data.n_elements}

    # The field as a per-graph attribute, not a node one: MACE multiplies it with the node features in
    # every layer (global_interaction below).  Not normalised: the chain differentiates with respect to
    # this field at zero, and a normalised field only carries its direction, which has no derivative there
    - _target_: tensorial.gcnn.Pack
      out_field: globals.attributes
      attrs:
        globals.external_electric_field:
          _target_: tensorial.tensors.SphericalHarmonic
          irreps: 0e + 1o
          normalise: False

    - _target_: tensorial.gcnn.EdgeVectors

    - _target_: tensorial.gcnn.EdgewiseEncoding
      attrs:
        edge_vectors:
          _target_: tensorial.tensors.SphericalHarmonic
          irreps:
            _target_: tensorial.make_irreps
            mul: 1
            ell_max: ${oc.select:ell_max,2}
            parity: sh
          normalise: True

    - _target_: tensorial.gcnn.RadialBasisEdgeEncoding
      r_max: ${r_max}

    # Hidden irreps: ${oc.select:mul,16} channels of every irrep up to ${oc.select:ell_max,2} (both parities), see
    # tensorial.make_irreps.  mul, ell_max and num_layers are set in train.yaml.
    - _target_: tensorial.gcnn.NodewiseLinear
      field: attributes
      irreps_out:
        _target_: tensorial.make_irreps
        mul: ${oc.select:mul,16}
        ell_max: ${oc.select:ell_max,2}

    # MACE in place of NequIP: the product basis multiplies the node features with each other up
    # to correlation_order inside every layer, so products such as field x geometry arise there
    # instead of only through the gates.  Its own readout (mace_readout) is not used: the heads
    # below read nodes.features, as with NequIP.
    - _target_: tensorial.gcnn.Mace
      irreps_out: 1x0e
      out_field: mace_readout
      hidden_irreps:
        _target_: tensorial.make_irreps
        mul: ${oc.select:mul,16}
        ell_max: ${oc.select:ell_max,2}
      num_interactions: ${oc.select:num_layers,2}
      correlation_order: ${oc.select:correlation_order,3}
      max_ell: ${oc.select:ell_max,2}
      num_types: ${from_data.n_elements}
      avg_num_neighbours: ${from_data.avg_num_neighbours}
      # The field enters every layer's product basis jointly with the node features (from
      # globals.attributes, see the Pack above), up to this order in the field
      global_interaction: True
      global_correlation_order: ${oc.select:global_correlation_order,2}

    # No NodewiseLinear bottleneck here: the readouts below read the whole stack, as in the NMR models

    # Per-atom Born effective charge tensor
    - _target_: tensorial.gcnn.NodewiseLinear
      irreps_out: 1x0e + 1x1e + 1x2e
      out_field: predicted_born_charges

    - _target_: tensorial.gcnn.NodewiseDecoding
      in_field: predicted_born_charges
      attrs:
        predicted_born_charges:
          _target_: tensorial.CartesianTensor
          formula: ij
          i: 1o
          j: 1o

    # Per atom Raman tensors
    - _target_: tensorial.gcnn.NodewiseLinear
      irreps_out: 2x1o + 1x2o + 1x3o
      out_field: predicted_raman_tensors

    - _target_: tensorial.gcnn.NodewiseDecoding
      in_field: predicted_raman_tensors
      attrs:
        predicted_raman_tensors:
          _target_: tensorial.CartesianTensor
          formula: ijk=ikj
          i: 1o
          j: 1o

    # Dielectric tensor: a symmetric per-atom contribution, summed over the structure.  A sum
    # rather than a mean because tensorial's segment_mean cannot yet broadcast its mask over
    # (n, 3, 3) values; every BTO cell has 135 atoms, so the two differ by a constant factor.
    - _target_: tensorial.gcnn.NodewiseLinear
      irreps_out: 1x0e + 1x2e
      out_field: dielectric_contribution

    - _target_: tensorial.gcnn.NodewiseDecoding
      in_field: dielectric_contribution
      attrs:
        dielectric_contribution:
          _target_: tensorial.CartesianTensor
          formula: ij=ji
          i: 1o
          j: 1o

    - _target_: tensorial.gcnn.NodewiseReduce
      field: dielectric_contribution
      out_field: predicted_dielectric_tensor
      reduce: sum
      as_array: True
