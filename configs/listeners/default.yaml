defaults:
  - model_checkpoint
  - early_stopping
  # - model_summary
  # - metrics_printer
  # - rich_progress_bar
  # - parity_plots
  - _self_

model_checkpoint:
  dirpath: ${paths.output_dir}/checkpoints
  filename: "epoch_{epoch:03d}"
  monitor: "val/nmr_tensors_rmse"
  mode: "min"
  save_last: True
  save_on_train_epoch_end: False
  auto_insert_metric_name: False

early_stopping:
  monitor: "val/nmr_tensors_rmse"
  min_delta: 0.001
  # Counted in validation checks.  reduce_on_plateau halves the step at most every 25 epochs
  # (patience 20 + cooldown 5): 200 leaves room for ~8 halvings, a step down to ~1/256, before
  # giving up.  At 100 runs stopped with the step still at 1/16-1/4 of its start
  patience: 200
  check_on_train_epoch_end: False

