# BTO, Born charges from the position derivative of an unsupervised dipole moment, Z* = ∂d/∂u.
# The position derivative alone, with no field: at zero field any d(R) or χ(R) can be written as -∂E/∂ε or
# -∂²E/∂ε², so the field derivative of the Sobolev adds no constraint; the sum rule and the integrability across
# atoms come from the derivative in the positions.  Same stack and settings as nequip_bto_direct.yaml (mul,
# layers, ell_max, edge harmonics, no readout bottleneck, num_species).

_target_: tensorial.ReaxModule

optimizer:
  _target_: optax.chain
  _args_:
    # Same schedule as the NMR models (see nequip_nmr.yaml): Adam, then reduce_on_plateau
    # halving the step after 20 epochs without a better training loss
    - _target_: optax.adam
      learning_rate: 0.01

    - _target_: optax.contrib.reduce_on_plateau
      factor: 0.5
      accumulation_size: ${from_data.steps_per_epoch}
      patience: 20
      rtol: 0.0001
      # Relative criterion only: the weighted BTO losses are ~0.07, where the NMR models' atol
      # of 0.001 asks for a 1.5% gain per epoch and halves the step down to 1/4096 by epoch ~400
      atol: 0.0
      cooldown: 5
      min_scale: 1.0e-6

metrics:
  BEC:
    _target_: tensorial.gcnn.graph_metric
    metric: rmse
    predictions: nodes.predicted_born_charges
    targets: nodes.born_charges

loss_fn:
  _target_: tensorial.gcnn.WeightedLoss
  weights:
    - ${oc.select:w_born,1.}
  loss_fns:
    - _target_: tensorial.gcnn.Loss
      loss_fn: squared_error
      predictions: nodes.predicted_born_charges
      targets: nodes.born_charges

model:
  _target_: tensorial.nn.Sequential
  layers:
    - _target_: tensorial.gcnn.atomic.SpeciesTransform
      atomic_numbers: ${from_data.atomic_numbers}

    - _target_: tensorial.gcnn.NodewiseEmbedding
      attrs:
        species:
          _target_: tensorial.tensors.OneHot
          num_classes: ${from_data.n_elements}

    - _target_: tensorial.gcnn.EdgeVectors

    - _target_: tensorial.gcnn.EdgewiseEncoding
      attrs:
        edge_vectors:
          _target_: tensorial.tensors.SphericalHarmonic
          irreps:
            _target_: tensorial.make_irreps
            mul: 1
            ell_max: ${oc.select:ell_max,2}
            parity: sh
          normalise: True

    - _target_: tensorial.gcnn.RadialBasisEdgeEncoding
      r_max: ${r_max}

    # Hidden irreps: ${oc.select:mul,16} channels of every irrep up to ${oc.select:ell_max,2} (both parities), see
    # tensorial.make_irreps.  mul, ell_max and num_layers are set in train.yaml.
    - _target_: tensorial.gcnn.NodewiseLinear
      field: attributes
      irreps_out:
        _target_: tensorial.make_irreps
        mul: ${oc.select:mul,16}
        ell_max: ${oc.select:ell_max,2}

    - _target_: tensorial.gcnn.Nequip
      hidden_irreps:
        _target_: tensorial.make_irreps
        mul: ${oc.select:mul,16}
        ell_max: ${oc.select:ell_max,2}
      num_layers: ${oc.select:num_layers,3}
      # one self-connection matrix per element; without it every species shares one (the default is 1, and
      # jit clamps the species index silently)
      num_species: ${from_data.n_elements}
      avg_num_neighbours: ${from_data.avg_num_neighbours}

    # No NodewiseLinear bottleneck here: the readout below reads the whole stack, as in the NMR models

    # Dipole moment d(R), a sum of per-atom 1o contributions as in the Direct, with no label: only its
    # position derivative is trained
    - _target_: tensorial.gcnn.NodewiseLinear
      irreps_out: 1x1o
      out_field: dipole_contribution

    - _target_: tensorial.gcnn.NodewiseDecoding
      in_field: dipole_contribution
      attrs:
        dipole_contribution:
          _target_: tensorial.CartesianTensor
          formula: i
          i: 1o

    - _target_: tensorial.gcnn.NodewiseReduce
      field: dipole_contribution
      out_field: predicted_dipole_moment
      reduce: sum
      as_array: True

    # Z*_{i,αγ} = ∂d_α/∂u_{iγ}, field index first, as the Sobolev's ∂F_{iγ}/∂ε_α and the stored labels
    - _target_: e3response.electric_linked.BornChargesFromDipole
      _partial_: True
