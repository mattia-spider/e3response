# Split stratified by Qn signature, so every partition holds the Q classes in the same ratio.
# For a plain random split use `_target_: tensorial.gcnn.data.RandomSplit` with the same
# `fractions`; for k-fold cross-validation use `_target_: tensorial.gcnn.data.KFoldSplit` with
# `fold`, `n_folds` and `test_fraction` (not stratified).
_target_: tensorial.gcnn.data.GraphDataModule
dataset:
  _target_: e3response.data.si_nmr.SiNmrDataset
  r_max: ${r_max}
  data_file: ${paths.data_dir}/si_nmr/si_data.json
  # limit: 50
strategy:
  _target_: e3response.data.GroupedRandomSplit
  fractions: [0.80, 0.10, 0.10]
batch_size: 20 # Needs to be divisible by the number of devices (e.g., if in a distributed setup)
