_target_: tensorial.ReaxModule

# Energy of a DFT+U state from the structure and the Hubbard occupation matrices, see
# e3response.occupation and e3response.data.occupation_energy.  The network learns E - E_U on the
# Hubbard sites, averaged over the spin swap; E_U is added in closed form.

metrics:
    energy_rmse:
      _target_: tensorial.gcnn.graph_metric
      metric: rmse
      predictions: globals.predicted_energy
      targets: globals.energy

    energy_mae:
      _target_: tensorial.gcnn.graph_metric
      metric: mae
      predictions: globals.predicted_energy
      targets: globals.energy

optimizer:
  _target_: optax.chain
  _args_:
    # Adam first, then the plateau scaling, as in nequip_nmr.yaml
    - _target_: optax.adam
      learning_rate: 0.005

    - _target_: optax.contrib.reduce_on_plateau
      factor: 0.5
      accumulation_size: ${from_data.steps_per_epoch}
      patience: 20
      rtol: 0.0001
      atol: 0.0
      cooldown: 5
      min_scale: 1.0e-4

# Energies in eV, relative to each scan group: their spread is 0.2-1.3 eV, already O(1)
loss_fn:
  _target_: e3response.losses.response_loss
  energy: true

model:
  _target_: tensorial.nn.Sequential
  layers:
    - _target_: e3response.occupation.SpinFlipAverage
      model:
        _target_: tensorial.nn.Sequential
        layers:
          - _target_: tensorial.gcnn.atomic.SpeciesTransform
            atomic_numbers: ${from_data.atomic_numbers}

          # Species, and the occupation matrix of each spin channel as 0e + 2e + 4e
          - _target_: tensorial.gcnn.NodewiseEncoding
            attrs:
              species:
                _target_: tensorial.tensors.OneHot
                num_classes: ${from_data.n_elements}
              occupation_up:
                _target_: e3response.occupation.OccupationMatrix
                l: 2
              occupation_down:
                _target_: e3response.occupation.OccupationMatrix
                l: 2

          - _target_: tensorial.gcnn.EdgeVectors

          # ell_max >= 4: the ligand field of an octahedral cage is almost all l = 4, which a
          # d occupation matrix couples to through its 4e part
          - _target_: tensorial.gcnn.EdgewiseEncoding
            attrs:
              edge_vectors:
                _target_: tensorial.tensors.SphericalHarmonic
                irreps:
                  _target_: tensorial.make_irreps
                  mul: 1
                  ell_max: ${oc.select:ell_max,4}
                  parity: sh
                normalise: True

          - _target_: tensorial.gcnn.RadialBasisEdgeEncoding
            r_max: ${r_max}

          - _target_: tensorial.gcnn.NodewiseLinear
            field: attributes
            irreps_out:
              _target_: tensorial.make_irreps
              mul: ${oc.select:mul,8}
              ell_max: ${oc.select:ell_max,4}
              parity: e + o

          - _target_: tensorial.gcnn.Nequip
            hidden_irreps:
              _target_: tensorial.make_irreps
              mul: ${oc.select:mul,8}
              ell_max: ${oc.select:ell_max,4}
              parity: e + o
            num_layers: ${oc.select:num_layers,2}
            num_species: ${from_data.n_elements}
            avg_num_neighbours: ${from_data.avg_num_neighbours}

          # E - E_U from the Hubbard sites only: the states of a structure differ by their
          # occupations, and the other atoms only see them through the messages
          - _target_: tensorial.gcnn.NodewiseLinear
            irreps_out: 1x0e
            out_field: energy

          - _target_: e3response.occupation.NodewiseMask
            field: energy

          - _target_: tensorial.gcnn.NodewiseReduce
            field: energy
            out_field: predicted_energy
            as_array: True

    - _target_: e3response.occupation.HubbardEnergy
