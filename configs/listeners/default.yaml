defaults:
  - model_checkpoint
  - early_stopping
  # - model_summary
  # - metrics_printer
  # - rich_progress_bar
  # - parity_plots
  - _self_

model_checkpoint:
  dirpath: ${paths.output_dir}/checkpoints
  filename: "epoch_{epoch:03d}"
  monitor: "val/nmr_tensors_rmse"
  mode: "min"
  save_last: True
  save_on_train_epoch_end: False
  auto_insert_metric_name: False

early_stopping:
  monitor: "val/nmr_tensors_rmse"
  min_delta: 0.001
  patience: 100
  check_on_train_epoch_end: False

